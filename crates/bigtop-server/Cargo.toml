[package]
name = "bigtop-server"
version = "0.1.0"
edition = "2021"
description = "BigTop server: REST API, in-memory store, and scheduler"

[dependencies]
axum = "0.8"
bigtop-core = { path = "../bigtop-core" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "scheduler"
harness = false
