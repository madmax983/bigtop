[package]
name = "bigtop-agent"
version = "0.1.0"
edition = "2021"
description = "BigTop agent: registers, heartbeats, and runs tasks as microVMs or processes"

[dependencies]
base64 = "0.22"
bigtop-core = { path = "../bigtop-core" }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
