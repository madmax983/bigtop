# Tier 1 — real Firecracker verification (KVM lane).
#
# Boots an actual Firecracker microVM on a KVM-capable runner and proves
# guest execution plus snapshot/restore. See docs/kvm-ci.md for runner
# setup. This workflow NEVER runs on GitHub-hosted runners: ordinary
# hosted runners have no /dev/kvm, and the preflight below fails fast
# rather than silently skipping the tests.

name: kvm

on:
  workflow_dispatch:
  schedule:
    # Nightly, 05:00 UTC.
    - cron: "0 5 * * *"
  pull_request:
    paths:
      - "crates/bigtop-agent/**"
      - "crates/bigtop-core/**"
      - "scripts/kvm/**"
      - ".github/workflows/kvm.yml"
      - "docs/kvm-ci.md"

concurrency:
  group: kvm-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  firecracker:
    name: real Firecracker boot + snapshot/restore
    runs-on: [self-hosted, linux, kvm]

    env:
      # Pinned guest artifacts. Hashes measured 2026-09-13 from the
      # official sources; re-pin in docs/kvm-ci.md if they ever change.
      FIRECRACKER_VERSION: "v1.17.0"
      FIRECRACKER_SHA256: "06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558"
      KERNEL_URL: "https://s3.amazonaws.com/spec.ccfc.min/img/quickstart_guide/x86_64/kernels/vmlinux.bin"
      KERNEL_SHA256: "264c461809cec3961b162d241b66a4b004f194fbaa44b1570f3f61c316d8ea69"

    steps:
      - name: Fail-fast KVM preflight
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing. This lane requires a KVM-capable runner (see docs/kvm-ci.md). Failing instead of skipping."
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm exists but is not readable/writable by this user. Add the runner user to the kvm group."
            exit 1
          fi
          for tool in curl mke2fs sha256sum; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is required on the runner"; exit 1; }
          done
          echo "KVM preflight OK: $(ls -l /dev/kvm)"

      - uses: actions/checkout@v4

      - name: Install pinned Firecracker
        run: |
          set -euo pipefail
          tgz="firecracker-${FIRECRACKER_VERSION}-x86_64.tgz"
          curl -fsSL --http1.1 -o "/tmp/$tgz" \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FIRECRACKER_VERSION}/$tgz"
          echo "${FIRECRACKER_SHA256}  /tmp/$tgz" | sha256sum -c -
          tar -xzf "/tmp/$tgz" -C /tmp
          sudo install -m 0755 "/tmp/release-${FIRECRACKER_VERSION}-x86_64/firecracker-${FIRECRACKER_VERSION}-x86_64" /usr/local/bin/firecracker
          firecracker --version

      - name: Provision guest artifacts
        run: |
          set -euo pipefail
          mkdir -p target/kvm-guest
          curl -fsSL --http1.1 -o target/kvm-guest/vmlinux.bin "$KERNEL_URL"
          echo "${KERNEL_SHA256}  target/kvm-guest/vmlinux.bin" | sha256sum -c -
          bash scripts/kvm/build-rootfs.sh target/kvm-guest

      - name: Run KVM-gated Firecracker tests
        env:
          BIGTOP_FIRECRACKER_BIN: /usr/local/bin/firecracker
          BIGTOP_KVM_KERNEL: ${{ github.workspace }}/target/kvm-guest/vmlinux.bin
          BIGTOP_KVM_ROOTFS: ${{ github.workspace }}/target/kvm-guest/rootfs.ext4
        run: cargo test -p bigtop-agent --test kvm_boot -- --nocapture
