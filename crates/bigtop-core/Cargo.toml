[package]
name = "bigtop-core"
version = "0.1.0"
edition = "2021"
description = "BigTop core: domain types, wire DTOs, and the shared error type"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
toml = "0.8"
