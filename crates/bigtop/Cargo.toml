[package]
name = "bigtop"
version = "0.1.0"
edition = "2021"
description = "BigTop: one binary. Server, agent, and CLI for the microVM orchestrator."

[[bin]]
name = "bigtop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bigtop-agent = { path = "../bigtop-agent" }
bigtop-core = { path = "../bigtop-core" }
bigtop-server = { path = "../bigtop-server" }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
